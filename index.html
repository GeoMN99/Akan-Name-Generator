<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akan Name Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    

    <div class="container">
        <h1>Akan Name Generator</h1>
        <p>Enter your birthdate and gender to find out your Akan name!</p>

        <div class="form-group">
            <label for="day">Day (1-31):</label>
            <input type="number" id="day" placeholder="e.g. 27">
        </div>

        <div class="form-group">
            <label for="month">Month (1-12):</label>
            <input type="number" id="month" placeholder="e.g. 6">
        </div>

        <div class="form-group">
            <label for="year">Year:</label>
            <input type="number" id="year" placeholder="e.g. 2000">
        </div>

        <div class="form-group">
            <label for="gender">Gender:</label>
            <select id="gender">
                <option value="">-- Select Gender --</option>
                <option value="male">Male:</option>
                <option value="female">Female:</option>
            </select>
        </div>

        
    </div>
</body>
</html>
